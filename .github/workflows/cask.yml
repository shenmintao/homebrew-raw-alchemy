name: Validate Homebrew Cask

on:
  push:
    paths:
      - Casks/**
      - .github/workflows/cask.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4

      - name: Tap the checkout
        run: brew tap --custom-remote shenmintao/raw-alchemy "$GITHUB_WORKSPACE"

      - name: Check Cask style
        run: brew style --cask shenmintao/raw-alchemy/raw-alchemy-studio

      - name: Audit Cask metadata
        run: brew audit --cask shenmintao/raw-alchemy/raw-alchemy-studio

      - name: Verify release download and checksum
        run: brew fetch --cask shenmintao/raw-alchemy/raw-alchemy-studio
